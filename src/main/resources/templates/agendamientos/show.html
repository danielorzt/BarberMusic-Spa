<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{administrador/template_admins.html::head}">
    <title>Agendamientos | BarberMusic Admin</title>
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <div th:replace="~{administrador/template_admins.html::aside}"></div>

      <!-- Main Content -->
      <main class="agendamientos-main">
        <!-- Encabezado -->
        <div class="page-header">
          <h1>
            <span class="material-icons-sharp">calendar_today</span>
            Agendamientos
          </h1>
          <nav class="breadcrumbs">
            <a th:href="@{/administrador}">Inicio</a>
            <span class="material-icons-sharp">chevron_right</span>
            <span>Agendamientos</span>
          </nav>
        </div>

        <!-- Contenido Principal -->
        <section class="tabla-section">
          <div class="card">
            <div class="card-header">
              <h2>Lista de Agendamientos</h2>
            </div>

            <div class="card-body">
              <div class="table-responsive">
                <table class="agendamientos-table">
                  <thead>
                    <tr>
                      <th>Fecha y Hora</th>
                      <th>Estado</th>
                      <th>Cliente</th>
                      <th>Servicio</th>
                      <th>Sucursal</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="agendamiento : ${agendamientos}">
                      <td
                        th:text="${#temporals.format(agendamiento.fechaHora, 'dd/MM/yyyy HH:mm')}"
                      ></td>
                      <td>
                        <span
                          class="status-badge"
                          th:classappend="${agendamiento.estado.toLowerCase()}"
                        >
                          <span th:text="${agendamiento.estado}"></span>
                        </span>
                      </td>
                      <td th:text="${agendamiento.usuario.nombre}"></td>
                      <td th:text="${agendamiento.servicio.nombre}"></td>
                      <td th:text="${agendamiento.sucursal.nombre}"></td>
                      <td class="actions">
                        <a
                          th:href="@{/agendamientos/edit/{id}(id=${agendamiento.id})}"
                          class="btn-action btn-edit"
                          title="Editar"
                        >
                          <i class="bi bi-pencil-square"></i> Editar
                        </a>
                        <a
                          id="delete-agendamiento-link"
                          th:href="@{/agendamientos/delete/{id}(id=${agendamiento.id})}"
                          class="btn-action btn-delete"
                          title="Eliminar"
                        >
                          <i class="bi bi-trash"></i> Eliminar
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Right Section -->
      <div
        th:replace="~{administrador/template_admins.html::right_section}"
      ></div>
    </div>

    <div th:replace="~{administrador/template_admins.html::jsFiles}"></div>
    <script>
      setActiveLink("agendamientos-link");
      // Opcional: Inicializar plugins de tabla si es necesario
      document.addEventListener("DOMContentLoaded", function () {
        const deleteLink = document.getElementById("delete-agendamiento-link");
        if (deleteLink) {
          deleteLink.addEventListener("click", async function (event) {
            event.preventDefault(); // Prevenir la navegación inmediata

            const confirmed = await showConfirmDialog(
              "¿Estás seguro?",
              "Esta acción eliminará el agendamiento permanentemente."
            );

            if (confirmed) {
              window.location.href = deleteLink.href; // Proceder a la URL de eliminación
            }
          });
        }
      });
    </script>
  </body>
</html>
