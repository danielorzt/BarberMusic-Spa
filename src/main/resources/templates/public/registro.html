<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - BarberSpa</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="/assets/css/main.css" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.png" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/">
          <i class="bi bi-scissors me-2"></i>BarberSpa
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card border-0 shadow">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <i
                  class="bi bi-person-plus text-primary"
                  style="font-size: 3rem"
                ></i>
                <h3 class="mt-3">Crear Cuenta</h3>
                <p class="text-muted">
                  Únete a BarberSpa y disfruta de nuestros servicios
                </p>
              </div>

              <!-- Error Message -->
              <div
                th:if="${error}"
                class="alert alert-danger alert-dismissible fade show"
                role="alert"
              >
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}">Error</span>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                ></button>
              </div>

              <form th:action="@{/publico/registro}" method="post">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="nombre" class="form-label">Nombre</label>
                      <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="apellido" class="form-label">Apellido</label>
                      <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        name="apellido"
                        placeholder="Tu apellido"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-envelope"></i>
                    </span>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      placeholder="tu@email.com"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-telephone"></i>
                    </span>
                    <input
                      type="tel"
                      class="form-control"
                      id="telefono"
                      name="telefono"
                      placeholder="993-xxx-xxxx"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-lock"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      placeholder="Tu contraseña"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Confirmar Contraseña</label
                  >
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-lock"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control"
                      id="confirmPassword"
                      name="confirmPassword"
                      placeholder="Confirma tu contraseña"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3 form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="aceptarTerminos"
                    name="aceptarTerminos"
                    required
                  />
                  <label class="form-check-label" for="aceptarTerminos">
                    Acepto los
                    <a href="#" class="text-decoration-none"
                      >términos y condiciones</a
                    >
                  </label>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                  </button>
                </div>
              </form>

              <hr class="my-4" />

              <!-- Social Registration -->
              <div class="text-center">
                <p class="text-muted mb-3">O regístrate con</p>
                <div class="d-flex justify-content-center gap-2">
                  <a
                    href="/oauth2/authorization/google"
                    class="btn btn-outline-danger"
                  >
                    <i class="bi bi-google"></i> Google
                  </a>
                  <a
                    href="/oauth2/authorization/facebook"
                    class="btn btn-outline-primary"
                  >
                    <i class="bi bi-facebook"></i> Facebook
                  </a>
                </div>
              </div>

              <hr class="my-4" />

              <!-- Links -->
              <div class="text-center">
                <p class="mb-0">
                  ¿Ya tienes cuenta?
                  <a href="/publico/login" class="text-decoration-none fw-bold"
                    >Inicia sesión aquí</a
                  >
                </p>
              </div>
            </div>
          </div>

          <!-- Back to Home -->
          <div class="text-center mt-3">
            <a href="/" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-2"></i>Volver al Inicio
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">
          &copy; 2024 BarberSpa. Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/sweetalert-config.js"></script>
  </body>
</html>
