<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{publico/template_user.html::head}">
    <title>Mantenimiento | BarberMusic&Spa</title>
</head>

<body class="index-page">

<div th:insert="~{publico/template_user.html::header}" th:if="${sesion == null and not isAuthenticated}"></div>
<div th:insert="~{publico/template_user.html::usuarioCabecera}" th:if="${sesion != null or isAuthenticated}"></div>

<main id="main" style="min-height: 70vh; display: flex; align-items: center; padding: 80px 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="maintenance-icon mb-4">
                    <i class="bi bi-tools text-warning" style="font-size: 5rem;"></i>
                </div>
                
                <h1 class="display-4 mb-4">Sitio en Mantenimiento</h1>
                
                <p class="lead mb-4">
                    Estamos realizando mejoras en nuestro sistema para brindarte una mejor experiencia.
                </p>
                
                <p class="mb-4">
                    Volveremos pronto. Gracias por tu paciencia.
                </p>
                
                <a href="/home" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{publico/template_user.html::footer}"></div>

<!-- Scroll Top -->
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
</a>

<!-- Preloader -->
<div id="preloader"></div>

<div th:insert="~{publico/template_user.html::jsFiles}"></div>

</body>
</html>
