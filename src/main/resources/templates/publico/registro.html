<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BarberMusic&Spa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="register-card">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                        <h2>Registro en BarberMusic&Spa</h2>
                        <p class="text-muted">Crea tu cuenta como Cliente</p>
                    </div>

                    <!-- Mensajes de error/éxito -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle me-2"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Formulario de registro -->
                    <form th:action="@{/usuario/save}" th:object="${usuario}" method="post">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                <i class="fas fa-user me-2"></i>Nombre completo
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="nombre" 
                                   th:field="*{nombre}"
                                   placeholder="Ej: Juan Pérez"
                                   required>
                            <div th:if="${#fields.hasErrors('nombre')}" class="text-danger mt-1">
                                <small th:errors="*{nombre}"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope me-2"></i>Email
                            </label>
                            <input type="email" 
                                   class="form-control" 
                                   id="email" 
                                   th:field="*{email}"
                                   placeholder="tu@email.com"
                                   required>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger mt-1">
                                <small th:errors="*{email}"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">
                                <i class="fas fa-phone me-2"></i>Teléfono
                            </label>
                            <input type="tel" 
                                   class="form-control" 
                                   id="telefono" 
                                   th:field="*{telefono}"
                                   placeholder="Ej: +52 999 123 4567">
                            <div th:if="${#fields.hasErrors('telefono')}" class="text-danger mt-1">
                                <small th:errors="*{telefono}"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock me-2"></i>Contraseña
                            </label>
                            <input type="password" 
                                   class="form-control" 
                                   id="password" 
                                   th:field="*{password}"
                                   placeholder="Mínimo 6 caracteres"
                                   required>
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1">
                                <small th:errors="*{password}"></small>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus me-2"></i>Registrarse
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="mb-0">¿Ya tienes cuenta? 
                                <a th:href="@{/publico/login}" class="text-decoration-none">
                                    Inicia sesión aquí
                                </a>
                            </p>
                        </div>
                    </form>

                    <hr class="my-4">
                    
                    <div class="text-center">
                        <a th:href="@{/home}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para validación de email en tiempo real -->
    <script>
        document.getElementById('email').addEventListener('blur', function() {
            const email = this.value;
            if (email) {
                fetch('/usuario/validar-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'email=' + encodeURIComponent(email)
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.disponible) {
                        this.classList.add('is-invalid');
                        // Mostrar mensaje de error
                        let errorDiv = this.parentNode.querySelector('.email-error');
                        if (!errorDiv) {
                            errorDiv = document.createElement('div');
                            errorDiv.className = 'text-danger mt-1 email-error';
                            this.parentNode.appendChild(errorDiv);
                        }
                        errorDiv.innerHTML = '<small>' + data.mensaje + '</small>';
                    } else {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                        const errorDiv = this.parentNode.querySelector('.email-error');
                        if (errorDiv) {
                            errorDiv.remove();
                        }
                    }
                })
                .catch(error => {
                    console.error('Error validando email:', error);
                });
            }
        });
    </script>
</body>
</html>
