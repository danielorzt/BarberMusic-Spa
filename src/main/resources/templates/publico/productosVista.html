<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{publico/template_user.html::head}"> </head>

  <body class="index-page">
    <!-- Header para usuarios no autenticados -->
    <div
      th:insert="~{publico/template_user.html::header}"
      th:if="${sesion == null}"
    ></div>
    <!-- Header para usuarios autenticados -->
    <div
      th:insert="~{publico/template_user.html::usuarioCabecera}"
      th:unless="${sesion == null}"
    ></div>

    <main class="main">
      <!-- Page Title -->
      <div class="page-title theme-background">
        <div class="container">
          <h1>Productos</h1>
          <nav class="breadcrumbs">
            <ol>
              <li><a th:href="@{/}">Inicio</a></li>
              <li class="current">Productos</li>
            </ol>
          </nav>
        </div>
        <section>
          <div
            class="container"
            th:insert="~{publico/template_user.html::search}"
          ></div>
        </section>
      </div>
      <!-- End Page Title -->

      <!-- Search Form -->
      <div class="container mt-4" th:if="${searchTerm == null}">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <form
              th:action="@{/searchProductos}"
              method="post"
              class="search-form"
            >
              <div class="input-group">
                <input
                  type="text"
                  name="nombreproducto"
                  class="form-control"
                  placeholder="Buscar productos..."
                  required
                />
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-search"></i> Buscar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Search Results Header -->
      <div class="container mt-3" th:if="${searchTerm != null}">
        <div class="row">
          <div class="col-12">
            <div class="alert alert-info">
              <h5><i class="bi bi-search"></i> Resultados de búsqueda</h5>
              <p class="mb-0">
                Buscando: "<span th:text="${searchTerm}"></span>" -
                <span th:text="${productos.size()}"></span> productos
                encontrados
              </p>
              <a
                th:href="@{/productosVista}"
                class="btn btn-sm btn-outline-primary mt-2"
              >
                <i class="bi bi-arrow-left"></i> Ver todos los productos
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="container py-5">
        <div class="row g-4 justify-content-center">
          <!-- Product Cards -->
          <div
            class="col-xl-3 col-lg-4 col-md-6 mb-4"
            th:each="producto: ${productos}"
          >
            <div class="card h-100 shadow-sm border-0 product-card">
              <!-- Product Image -->
              <div
                class="product-img-container position-relative"
                style="height: 200px; overflow: hidden"
              >
                <img
                  th:src="@{${producto.imagen != null ? producto.imagen : '/assets/img/productos/default-product.jpg'}}"
                  th:alt="${producto.nombreproducto}"
                  class="card-img-top rounded-top product-img"
                  style="
                    object-fit: cover;
                    height: 100%;
                    width: 100%;
                    transition: transform 0.3s;
                  "
                />
              </div>

              <!-- Product Body -->
              <div class="card-body text-center d-flex flex-column">
                <h5
                  class="card-title fw-bold mb-3"
                  th:text="${producto.nombreproducto}"
                  style="
                    font-size: 1.1rem;
                    min-height: 3.5em;
                    display: -webkit-box;
                    -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                  "
                ></h5>

                <!-- Price Section -->
                <div class="mt-auto">
                  <div class="mb-3">
                    <span
                      class="text-danger fw-bold fs-5"
                      th:text="${#strings.concat('$', #numbers.formatDecimal(producto.precio, 0, 'POINT',0, 'POINT'))}"
                    ></span>
                  </div>

                  <!-- View Product Button -->
                  <div
                    class="card-footer bg-transparent border-0 text-center pt-0"
                  >
                    <a
                      th:href="@{/productoHome/{id} (id=${producto.id})}"
                      class="btn btn-danger px-4 py-2 btn-view-product"
                      style="transition: all 0.3s"
                    >
                      <i class="bi bi-eye me-2"></i> Ver Producto
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- No Products Message -->
        <div class="row" th:if="${productos.empty}">
          <div class="col-12 text-center">
            <div class="alert alert-info">
              <i class="bi bi-info-circle"></i>
              <span th:if="${searchTerm != null}"
                >No se encontraron productos que coincidan con tu
                búsqueda.</span
              >
              <span th:unless="${searchTerm != null}"
                >No hay productos disponibles en este momento.</span
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:insert="~{publico/template_user.html::footer}"></div>
    <!-- Scroll Top -->
    <a
      href="#"
      id="scroll-top"
      class="scroll-top d-flex align-items-center justify-content-center"
      ><i class="bi bi-arrow-up-short"></i
    ></a>

    <!-- Preloader -->
    <div id="preloader"></div>

    <div th:insert="~{publico/template_user.html::jsFiles}"></div>
  </body>
</html>
