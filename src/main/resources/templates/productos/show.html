<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{administrador/template_admins.html :: head}">
    <title>Productos | BarberMusic Admin</title>
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <div th:replace="~{administrador/template_admins.html :: aside}"></div>

      <!-- Main Content -->
      <main class="agendamientos-main">
        <!-- Encabezado -->
        <div class="page-header">
          <h1>
            <span class="material-icons-sharp">inventory</span>
            Productos
          </h1>
          <nav class="breadcrumbs">
            <a th:href="@{/administrador}">Inicio</a>
            <span class="material-icons-sharp">chevron_right</span>
            <span>Productos</span>
          </nav>
        </div>

        <!-- Contenido Principal -->
        <section class="tabla-section">
          <div class="card">
            <div class="card-header">
              <h2>Lista de Productos</h2>
              <a th:href="@{/productos/create}" class="btn-add">
                <span class="material-icons-sharp">add</span>
                Nuevo Producto
              </a>
            </div>

            <div class="card-body">
              <div class="table-responsive">
                <table class="agendamientos-table">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Descripción</th>
                      <th>Precio</th>
                      <th>Cantidad</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="producto, stat : ${productos}">
                      <td th:text="${producto.nombreproducto}"></td>
                      <td>
                        <span
                          class="text-truncate"
                          style="max-width: 200px; display: inline-block"
                          th:text="${producto.descripcion}"
                        >
                        </span>
                      </td>

                      <td
                        th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 2, 'COMMA')}"
                      ></td>
                      <td
                        th:text="${producto.cantidad}"
                        th:class="${producto.cantidad < 5} ? 'text-danger fw-bold : '"
                      ></td>
                      <td class="actions">
                        <a
                          th:href="@{/productos/edit/{id}(id=${producto.id})}"
                          class="btn-action btn-edit"
                          title="Editar"
                        >
                          <i class="bi bi-pencil-square"></i> Editar
                        </a>
                        <form
                          th:action="@{/productos/delete/{id}(id=${producto.id})}"
                          method="post"
                          class="delete-form d-inline"
                        >
                          <button
                            type="button"
                            class="btn-action btn-delete"
                            title="Eliminar"
                            th:attr="data-product-name=${producto.nombre}"
                          >
                            <i class="bi bi-trash"></i>
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Right Section -->
      <div
        th:replace="~{administrador/template_admins.html :: right_section}"
      ></div>
    </div>

    <div th:replace="~{administrador/template_admins.html :: jsFiles}"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setActiveLink("productos-link");
        document.querySelectorAll(".btn-delete").forEach((button) => {
          button.addEventListener("click", async function (event) {
            event.preventDefault();
            const form = this.closest("form");
            const productName = this.getAttribute("data-product-name");

            const confirmed = await showConfirmDialog(
              "¿Eliminar Producto?",
              `Se eliminará permanentemente el producto "${productName}" del inventario.`
            );

            if (confirmed) {
              form.submit();
            }
          });
        });
      });
    </script>
  </body>
</html>
